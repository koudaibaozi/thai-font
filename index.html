const PHONETIC_PROXY_URL='https://1447255451-k4y5jqz21l.ap-guangzhou.tencentscf.com';

let __phoneticTimer;
let __phoneticController;

function schedulePhonetic(){
  clearTimeout(__phoneticTimer);
  const text=t.value.trim();

  if(!text){
    if(phonetic)phonetic.textContent='';
    if(phoneticStatus)phoneticStatus.textContent='';
    return;
  }

  __phoneticTimer=setTimeout(()=>loadPhonetic(text),450);
}

async function loadPhonetic(text){
  if(!PHONETIC_PROXY_URL){
    if(phonetic)phonetic.textContent='';
    if(phoneticStatus)phoneticStatus.textContent='Add phonetic proxy URL.';
    return;
  }

  if(__phoneticController)__phoneticController.abort();
  __phoneticController=new AbortController();

  if(phoneticStatus)phoneticStatus.textContent='Loading...';

  try{
    const res=await fetch(PHONETIC_PROXY_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text}),
      signal:__phoneticController.signal
    });

    const data=await res.json();

    if(!res.ok){
      throw new Error(data.error||data.details||'Phonetic conversion failed');
    }

    if(phonetic)phonetic.textContent=data.phonetic||data.text||'';
    if(phoneticStatus)phoneticStatus.textContent='';
  }catch(error){
    if(error.name==='AbortError')return;
    console.error(error);
    if(phonetic)phonetic.textContent='';
    if(phoneticStatus)phoneticStatus.textContent='Phonetic conversion failed.';
  }
}

const __speak=document.getElementById('speakBtn');
const __voiceStatus=document.getElementById('voiceStatus');
const AZURE_TTS_PROXY_URL='https://1447255451-brdkzny90f.ap-guangzhou.tencentscf.com';
if(__voiceStatus)__voiceStatus.textContent='';
if(__speak){
  __speak.onclick=async function(){
    const text=t.value.trim();
    if(!text)return;
    __speak.disabled=true;
    if(__voiceStatus)__voiceStatus.textContent='Loading voice...';
    try{
      const res=await fetch(AZURE_TTS_PROXY_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text})
      });
      if(!res.ok){
        throw new Error(await res.text()||'Online voice failed');
      }
      // Tencent Function URL may return either real MP3 bytes or a Base64
      // string. Detect both formats and convert them into valid MP3 bytes.
      const rawBuffer=await res.arrayBuffer();
      if(!rawBuffer.byteLength){
        throw new Error('Empty audio response');
      }

      let bytes=new Uint8Array(rawBuffer);

      // Real MP3 usually begins with ID3 or an MPEG frame sync.
      const isMp3=
        (bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33) ||
        (bytes[0]===0xff&&(bytes[1]&0xe0)===0xe0);

      if(!isMp3){
        let payload=new TextDecoder().decode(bytes).trim();

        // Also support a JSON wrapper such as {"body":"BASE64..."}.
        if(payload.startsWith('{')){
          try{
            const json=JSON.parse(payload);
            payload=String(json.audio||json.body||json.data||'').trim();
          }catch(_){}
        }

        // Remove optional data-URL prefix and whitespace.
        payload=payload
          .replace(/^data:audio\/[a-z0-9.+-]+;base64,/i,'')
          .replace(/\s+/g,'');

        if(!payload){
          throw new Error('No audio data returned');
        }

        try{
          const binary=atob(payload);
          bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
        }catch(error){
          throw new Error('Tencent TTS response is not valid MP3 or Base64 audio');
        }
      }

      const blob=new Blob([bytes],{type:'audio/mpeg'});
      const audioUrl=URL.createObjectURL(blob);
      const audio=new Audio(audioUrl);
      audio.preload='auto';
      audio.onended=()=>URL.revokeObjectURL(audioUrl);
      audio.onerror=()=>{
        URL.revokeObjectURL(audioUrl);
        console.error('Audio decode/playback error',audio.error);
      };
      await audio.play();
      if(__voiceStatus)__voiceStatus.textContent='';
    }catch(error){
      console.error(error);
      if(__voiceStatus)__voiceStatus.textContent='Online voice failed. Please try again.';
    }finally{
      __speak.disabled=false;
    }
  };
}

const __translateBtn=document.getElementById('translateBtn');
async function translateChinese(text){
  const res=await fetch('https://1447255451-h6dpbnw3qv.ap-guangzhou.tencentscf.com',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text})
  });
  const data=await res.json();
  if(!res.ok){throw new Error(data.error||'Translation failed');}
  return data.translation||'';
}
if(__translateBtn){
  __translateBtn.onclick=async function(){
    const text=t.value.trim();
    if(!text){
      if(c)c.textContent='';
      if(translateStatus)translateStatus.textContent='Paste Thai text first.';
      return;
    }
    __translateBtn.disabled=true;
    if(translateStatus)translateStatus.textContent='Translating...';
    try{
      const zh=await translateChinese(text);
      if(c)c.textContent=zh;
      if(translateStatus)translateStatus.textContent='Done';
    }catch(e){
      if(translateStatus)translateStatus.textContent='Translation failed. Please try again.';
    }finally{
      __translateBtn.disabled=false;
    }
  };
}
