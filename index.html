n-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.translate-row button{padding:8px 18px;border:none;border-radius:8px;cursor:pointer}.status{font-size:14px;color:#666}footer{text-align:center;color:#777;margin-top:30px}</style></head><body><h2>Thai Font</h2><textarea id=t placeholder='Paste Thai here...'></textarea>
<div style="margin:12px 0;"><button id="speakBtn" style="padding:8px 18px;border:none;border-radius:8px;cursor:pointer;margin-right:8px;">Speak</button><button id="clearBtn" style="padding:8px 18px;border:none;border-radius:8px;cursor:pointer;margin-right:8px;">Clear</button><button id="translateBtn" style="padding:8px 18px;border:none;border-radius:8px;cursor:pointer;margin-right:8px;">Translate 中文</button><span id="voiceStatus" style="font-size:14px;color:#b00020;"></span></div><div class=box><b>Loop (Noto Serif Thai)</b><div id=a class=out></div></div><div class=box><b>Loopless (Noto Sans Thai)</b><div id=b class=out></div></div><div class=box><b>Chinese Translation</b><div id=c class=out></div><div class=translate-row><span id=translateStatus class=status></span></div></div><footer>© 2026 Chen</footer><script>const t=document.getElementById('t'),a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c'),translateStatus=document.getElementById('translateStatus');function u(){a.textContent=t.value;b.textContent=t.value;if(c)c.textContent='';if(translateStatus)translateStatus.textContent='';}['input','keyup','paste','change'].forEach(e=>t.addEventListener(e,()=>setTimeout(u,0)));u();
const __speak=document.getElementById('speakBtn');
const __voiceStatus=document.getElementById('voiceStatus');
let __thaiVoice=null;
function __checkThaiVoice(){
  if(!('speechSynthesis' in window)){
    if(__voiceStatus)__voiceStatus.textContent='Speech is not supported in this browser.';
    return false;
  }
  const voices=speechSynthesis.getVoices();
  __thaiVoice=voices.find(v=>(v.lang||'').toLowerCase().startsWith('th'))||null;
  if(__voiceStatus)__voiceStatus.textContent=__thaiVoice?'':'Please install Thai voice in your system.';
  return !!__thaiVoice;
}
__checkThaiVoice();
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=__checkThaiVoice;}
if(__speak){
  __speak.onclick=function(){
    const text=t.value.trim();
    if(!text)return;
    if(!__checkThaiVoice())return;
    speechSynthesis.cancel();
    const msg=new SpeechSynthesisUtterance(text);
    msg.lang='th-TH';
    if(__thaiVoice)msg.voice=__thaiVoice;
    speechSynthesis.speak(msg);
  };
}

const __translateBtn=document.getElementById('translateBtn');
async function translateChinese(text){
  const res=await fetch('https://thai-translator.chen-xin623.workers.dev',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text})
  });
  const data=await res.json();
  if(!res.ok){throw new Error(data.error||'Translation failed');}
  return data.translation||'';
}
if(__translateBtn){
  __translateBtn.onclick=async function(){
    const text=t.value.trim();
    if(!text){
      if(c)c.textContent='';
      if(translateStatus)translateStatus.textContent='Paste Thai text first.';
      return;
    }
    __translateBtn.disabled=true;
    if(translateStatus)translateStatus.textContent='Translating...';
    try{
      const zh=await translateChinese(text);
      if(c)c.textContent=zh;
      if(translateStatus)translateStatus.textContent='Done';
    }catch(e){
      if(translateStatus)translateStatus.textContent='Translation failed. Please try again.';
    }finally{
      __translateBtn.disabled=false;
    }
  };
}

const __btn=document.getElementById('clearBtn');
if(__btn){
  __btn.onclick=function(){
    const t=document.querySelector('textarea');
    if(t){
      t.value='';
      t.dispatchEvent(new Event('input',{bubbles:true}));
      t.dispatchEvent(new Event('change',{bubbles:true}));
    }
  };
}
</script></body></html>
